<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">PBDesk social preview</title>
  <desc id="description">PBDesk, from the desk of Pinal Bhatt. A personal space where code, AI, wellness, and mindful living meet.</desc>
  <defs>
    <linearGradient id="background" x1="600" y1="0" x2="600" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fafaff"/>
      <stop offset="0.58" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f7f8ff"/>
    </linearGradient>
    <radialGradient id="topLeftGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(190 40) rotate(56.3) scale(430 620)">
      <stop offset="0" stop-color="#c7d2fe" stop-opacity="0.78"/>
      <stop offset="0.62" stop-color="#c7d2fe" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="topRightGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(980 95) rotate(126.1) scale(350 470)">
      <stop offset="0" stop-color="#e9d5ff" stop-opacity="0.68"/>
      <stop offset="0.68" stop-color="#e9d5ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bottomGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(610 635) rotate(-90) scale(310 760)">
      <stop offset="0" stop-color="#e0e7ff" stop-opacity="0.8"/>
      <stop offset="0.74" stop-color="#e0e7ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="portraitAura" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(925 300) rotate(90) scale(238)">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.94"/>
      <stop offset="0.52" stop-color="#c7d2fe" stop-opacity="0.54"/>
      <stop offset="0.78" stop-color="#10b981" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <filter id="portraitShadow" x="-35%" y="-30%" width="170%" height="170%">
      <feDropShadow dx="0" dy="24" stdDeviation="26" flood-color="#18181b" flood-opacity="0.18"/>
    </filter>
    <pattern id="dotGrid" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#18181b" opacity="0.035"/>
    </pattern>
    <clipPath id="portraitClip">
      <circle cx="925" cy="313" r="166"/>
    </clipPath>
  </defs>

  <rect width="1200" height="630" fill="url(#background)"/>
  <rect width="1200" height="630" fill="url(#topLeftGlow)"/>
  <rect width="1200" height="630" fill="url(#topRightGlow)"/>
  <rect width="1200" height="630" fill="url(#bottomGlow)"/>
  <rect width="1200" height="630" fill="url(#dotGrid)" opacity="0.85"/>

  <path d="M64 78C64 58.1 80.1 42 100 42h1000c19.9 0 36 16.1 36 36v474c0 19.9-16.1 36-36 36H100c-19.9 0-36-16.1-36-36V78Z" fill="#ffffff" opacity="0.52"/>
  <path d="M64 78C64 58.1 80.1 42 100 42h1000c19.9 0 36 16.1 36 36v474c0 19.9-16.1 36-36 36H100c-19.9 0-36-16.1-36-36V78Z" fill="none" stroke="#e4e4e7"/>

  <g font-family="Onest, Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <g transform="translate(110 105)">
      <rect x="0" y="0" width="284" height="42" rx="21" fill="#ffffff" stroke="#c7d2fe"/>
      <text x="22" y="21" fill="#4f46e5" font-size="18" font-weight="700" dominant-baseline="middle">Learning endeavor forever...</text>
    </g>

    <text x="110" y="254" fill="#18181b" font-size="116" font-weight="800">PBDesk</text>
    <text x="116" y="312" fill="#4f46e5" font-size="34" font-weight="700">From the desk of Pinal Bhatt</text>
    <text x="116" y="372" fill="#52525b" font-size="28" font-weight="500">A personal space where code, AI, wellness,</text>
    <text x="116" y="412" fill="#52525b" font-size="28" font-weight="500">and mindful living meet.</text>

    <g transform="translate(116 472)">
      <rect x="0" y="0" width="112" height="42" rx="21" fill="#ffffff" stroke="#4f46e5" stroke-opacity="0.24"/>
      <image x="8" y="7" width="28" height="28" href="pillers/bits-avatar.svg" preserveAspectRatio="xMidYMid meet"/>
      <text x="48" y="28" fill="#4f46e5" font-size="18" font-weight="800">Bits</text>
      <rect x="130" y="0" width="122" height="42" rx="21" fill="#ffffff" stroke="#10b981" stroke-opacity="0.24"/>
      <image x="138" y="7" width="28" height="28" href="pillers/bites-avatar.svg" preserveAspectRatio="xMidYMid meet"/>
      <text x="178" y="28" fill="#10b981" font-size="18" font-weight="800">Bites</text>
      <rect x="270" y="0" width="116" height="42" rx="21" fill="#ffffff" stroke="#7c3aed" stroke-opacity="0.24"/>
      <image x="278" y="7" width="28" height="28" href="pillers/blog-avatar.svg" preserveAspectRatio="xMidYMid meet"/>
      <text x="318" y="28" fill="#7c3aed" font-size="18" font-weight="800">Blog</text>
    </g>
  </g>

  <g filter="url(#portraitShadow)">
    <circle cx="925" cy="313" r="222" fill="url(#portraitAura)"/>
    <circle cx="925" cy="313" r="182" fill="#ffffff" opacity="0.72" stroke="#e4e4e7"/>
    <image x="745" y="142" width="360" height="360" href="pb/pb-sq-no-bg.png" preserveAspectRatio="xMidYMid meet" clip-path="url(#portraitClip)"/>
  </g>

  <text x="110" y="555" fill="#71717a" font-family="Onest, Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-style="italic" font-weight="700">PBDesk.com</text>
</svg>
