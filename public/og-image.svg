        width="112"
        x="0"
        y="0"
      />
      <image
        height="28"
        href="pillers/bits-avatar.svg"
        preserveAspectRatio="xMidYMid meet"
        width="28"
        x="8"
        y="7"
      />
      <text fill="#4f46e5" font-size="18" font-weight="800" x="48" y="28">
        Bits
      </text>
      <rect
        fill="#ffffff"
        height="42"
        rx="21"
        stroke="#10b981"
        stroke-opacity="0.24"
        width="122"
        x="130"
        y="0"
      />
      <image
        height="28"
        href="pillers/bites-avatar.svg"
        preserveAspectRatio="xMidYMid meet"
        width="28"
        x="138"
        y="7"
      />
      <text fill="#10b981" font-size="18" font-weight="800" x="178" y="28">
        Bites
      </text>
      <rect
        fill="#ffffff"
        height="42"
        rx="21"
        stroke="#7c3aed"
        stroke-opacity="0.24"
        width="116"
        x="270"
        y="0"
      />
      <image
        height="28"
        href="pillers/blog-avatar.svg"
        preserveAspectRatio="xMidYMid meet"
        width="28"
        x="278"
        y="7"
      />
      <text fill="#7c3aed" font-size="18" font-weight="800" x="318" y="28">
        Blog
      </text>
    </g>
  </g>

  <g filter="url(#portraitShadow)">
    <circle cx="925" cy="313" fill="url(#portraitAura)" r="222" />
    <circle
      cx="925"
      cy="313"
      fill="#ffffff"
      opacity="0.72"
      r="182"
      stroke="#e4e4e7"
    />
    <image
      clip-path="url(#portraitClip)"
      height="360"
      href="pb/pb-sq-no-bg.png"
      preserveAspectRatio="xMidYMid meet"
      width="360"
      x="745"
      y="142"
    />
  </g>

  <text
    fill="#71717a"
    font-family="Onest, Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="18"
    font-style="italic"
    font-weight="700"
    x="110"
    y="555"
  >
    PBDesk.com
  </text>
</svg>
