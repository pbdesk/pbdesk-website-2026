    </text>
    <text fill="#52525b" font-size="28" font-weight="500" x="116" y="372">
      A personal space where code, AI, wellness,
    </text>
    <text fill="#52525b" font-size="28" font-weight="500" x="116" y="412">
      and mindful living meet.
    </text>

    <g transform="translate(116 472)">
      <rect
        fill="#ffffff"
        height="42"
        rx="21"
        stroke="#4f46e5"
