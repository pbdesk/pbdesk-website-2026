<svg
  aria-labelledby="title description"
  height="630"
  role="img"
  viewBox="0 0 1200 630"
  width="1200"
  xmlns="http://www.w3.org/2000/svg"
>
  <title id="title">PBDesk social preview</title>
  <desc id="description">
    PBDesk, from the desk of Pinal Bhatt. A personal space where code, AI,
    wellness, and mindful living meet.
  </desc>
  <defs>
    <linearGradient
      gradientUnits="userSpaceOnUse"
      id="background"
      x1="600"
      x2="600"
      y1="0"
      y2="630"
    >
      <stop offset="0" stop-color="#fafaff" />
      <stop offset="0.58" stop-color="#ffffff" />
      <stop offset="1" stop-color="#f7f8ff" />
    </linearGradient>
    <radialGradient
      cx="0"
      cy="0"
      gradientTransform="translate(190 40) rotate(56.3) scale(430 620)"
      gradientUnits="userSpaceOnUse"
      id="topLeftGlow"
      r="1"
    >
      <stop offset="0" stop-color="#c7d2fe" stop-opacity="0.78" />
      <stop offset="0.62" stop-color="#c7d2fe" stop-opacity="0" />
    </radialGradient>
    <radialGradient
      cx="0"
      cy="0"
      gradientTransform="translate(980 95) rotate(126.1) scale(350 470)"
      gradientUnits="userSpaceOnUse"
      id="topRightGlow"
      r="1"
    >
      <stop offset="0" stop-color="#e9d5ff" stop-opacity="0.68" />
      <stop offset="0.68" stop-color="#e9d5ff" stop-opacity="0" />
    </radialGradient>
    <radialGradient
      cx="0"
      cy="0"
      gradientTransform="translate(610 635) rotate(-90) scale(310 760)"
      gradientUnits="userSpaceOnUse"
      id="bottomGlow"
      r="1"
    >
      <stop offset="0" stop-color="#e0e7ff" stop-opacity="0.8" />
      <stop offset="0.74" stop-color="#e0e7ff" stop-opacity="0" />
    </radialGradient>
    <radialGradient
      cx="0"
      cy="0"
      gradientTransform="translate(925 300) rotate(90) scale(238)"
      gradientUnits="userSpaceOnUse"
      id="portraitAura"
      r="1"
    >
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.94" />
      <stop offset="0.52" stop-color="#c7d2fe" stop-opacity="0.54" />
      <stop offset="0.78" stop-color="#10b981" stop-opacity="0.2" />
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0" />
    </radialGradient>
    <filter height="170%" id="portraitShadow" width="170%" x="-35%" y="-30%">
      <feDropShadow
        dx="0"
        dy="24"
        flood-color="#18181b"
        flood-opacity="0.18"
        stdDeviation="26"
      />
    </filter>
    <pattern height="22" id="dotGrid" patternUnits="userSpaceOnUse" width="22">
      <circle cx="1" cy="1" fill="#18181b" opacity="0.035" r="1" />
    </pattern>
    <clipPath id="portraitClip">
      <circle cx="925" cy="313" r="166" />
    </clipPath>
  </defs>

  <rect fill="url(#background)" height="630" width="1200" />
  <rect fill="url(#topLeftGlow)" height="630" width="1200" />
  <rect fill="url(#topRightGlow)" height="630" width="1200" />
  <rect fill="url(#bottomGlow)" height="630" width="1200" />
  <rect fill="url(#dotGrid)" height="630" opacity="0.85" width="1200" />

  <path
    d="M64 78C64 58.1 80.1 42 100 42h1000c19.9 0 36 16.1 36 36v474c0 19.9-16.1 36-36 36H100c-19.9 0-36-16.1-36-36V78Z"
    fill="#ffffff"
    opacity="0.52"
  />
  <path
    d="M64 78C64 58.1 80.1 42 100 42h1000c19.9 0 36 16.1 36 36v474c0 19.9-16.1 36-36 36H100c-19.9 0-36-16.1-36-36V78Z"
    fill="none"
    stroke="#e4e4e7"
  />

