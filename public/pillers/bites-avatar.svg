  <clipPath id="clip-av"><circle cx="256" cy="256" r="256"></circle></clipPath>
  <g clip-path="url(#clip-av)">
    <circle cx="256" cy="256" fill="url(#glow-emerald)" r="280"></circle>
    <g transform="translate(256,256) scale(2.0)">
