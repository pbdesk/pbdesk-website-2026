<svg
  height="512"
  viewBox="0 0 512 512"
  width="512"
  xmlns="http://www.w3.org/2000/svg"
>
  <defs>
    <pattern
      height="28"
      id="grid"
      patternUnits="userSpaceOnUse"
      width="28"
      x="0"
      y="0"
    >
      <circle cx="1.2" cy="1.2" fill="#27272A" r="1.2"></circle>
    </pattern>
    <radialGradient cx="50%" cy="50%" id="glow-blue" r="50%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.35"></stop>
      <stop offset="60%" stop-color="#3B82F6" stop-opacity="0.08"></stop>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"></stop>
    </radialGradient>
    <radialGradient cx="50%" cy="50%" id="glow-emerald" r="50%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.35"></stop>
      <stop offset="60%" stop-color="#10B981" stop-opacity="0.08"></stop>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"></stop>
    </radialGradient>
    <radialGradient cx="50%" cy="50%" id="glow-violet" r="50%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.4"></stop>
      <stop offset="60%" stop-color="#7C3AED" stop-opacity="0.08"></stop>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"></stop>
    </radialGradient>
    <linearGradient id="tile-blue" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#3B82F6"></stop>
      <stop offset="100%" stop-color="#1D4ED8"></stop>
    </linearGradient>
    <linearGradient id="tile-emerald" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#34D399"></stop>
      <stop offset="100%" stop-color="#059669"></stop>
    </linearGradient>
    <linearGradient id="tile-violet" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#8B5CF6"></stop>
      <stop offset="100%" stop-color="#2563EB"></stop>
    </linearGradient>
  </defs>
  <clipPath id="clip-av"><circle cx="256" cy="256" r="256"></circle></clipPath>
  <g clip-path="url(#clip-av)">
    <circle cx="256" cy="256" fill="url(#glow-blue)" r="280"></circle>
    <g transform="translate(256,256) scale(2.0)">
      <g>
        <rect
          fill="url(#tile-blue)"
          height="180"
          rx="36"
          width="180"
          x="-90"
          y="-90"
        ></rect>
        <rect
          fill="none"
          height="180"
          rx="36"
          stroke="#fff"
          stroke-opacity="0.16"
          width="180"
          x="-90"
          y="-90"
        ></rect>
        <g opacity="0.18" stroke="#fff" stroke-width="1">
          <line x1="-90" x2="90" y1="-30" y2="-30"></line>
          <line x1="-90" x2="90" y1="30" y2="30"></line>
          <line x1="-30" x2="-30" y1="-90" y2="90"></line>
          <line x1="30" x2="30" y1="-90" y2="90"></line>
        </g>
        <g
          fill="none"
          stroke="#fff"
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="10"
        >
          <polyline points="-36,-26 -58,0 -36,26"></polyline>
          <polyline points="36,-26 58,0 36,26"></polyline>
          <line x1="14" x2="-14" y1="-30" y2="30"></line>
        </g>
        <g fill="#FDE68A" transform="translate(52,-52)">
          <path d="M0 -16 L4 -4 L16 0 L4 4 L0 16 L-4 4 L-16 0 L-4 -4 Z"></path>
        </g>
        <g fill="#7DD3FC" transform="translate(-58,58)">
          <path d="M0 -8 L2 -2 L8 0 L2 2 L0 8 L-2 2 L-8 0 L-2 -2 Z"></path>
        </g>
      </g>
    </g>
  </g>
  <circle
    cx="256"
    cy="256"
    fill="none"
    r="254"
    stroke="#2563EB"
    stroke-width="4"
  ></circle>
</svg>
