<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 627" width="1200" height="627">
  <defs>
    <radialGradient id="bg" cx="30%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#050510"/>
    </radialGradient>
    <linearGradient id="t1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7dd3a0" stop-opacity="0"/>
      <stop offset="20%" stop-color="#7dd3a0" stop-opacity="0.9"/>
      <stop offset="80%" stop-color="#4ade80" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#4ade80" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="t2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0"/>
      <stop offset="20%" stop-color="#fbbf24" stop-opacity="0.9"/>
      <stop offset="80%" stop-color="#f97316" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#f97316" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="t3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0"/>
      <stop offset="20%" stop-color="#818cf8" stop-opacity="0.9"/>
      <stop offset="80%" stop-color="#6366f1" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="t4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f472b6" stop-opacity="0"/>
      <stop offset="20%" stop-color="#f472b6" stop-opacity="0.9"/>
      <stop offset="80%" stop-color="#ec4899" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="627" fill="url(#bg)"/>

  <!-- Subtle dot grid -->
  <g fill="#ffffff" opacity="0.05">
    <circle cx="80" cy="80" r="1.5"/>
    <circle cx="1120" cy="80" r="1.5"/>
    <circle cx="80" cy="547" r="1.5"/>
    <circle cx="1120" cy="547" r="1.5"/>
    <circle cx="600" cy="50" r="1.5"/>
    <circle cx="600" cy="577" r="1.5"/>
  </g>

  <!-- Woven threads (4 sine-like paths weaving across the right half) -->
  <g fill="none" stroke-width="3" filter="url(#glow)">
    <!-- Glow underlays -->
    <path d="M 540 180 C 700 80, 900 280, 1180 160" stroke="url(#t1)" opacity="0.4" stroke-width="14" filter="url(#soft)"/>
    <path d="M 540 290 C 700 200, 900 400, 1180 270" stroke="url(#t2)" opacity="0.4" stroke-width="14" filter="url(#soft)"/>
    <path d="M 540 400 C 700 320, 900 520, 1180 380" stroke="url(#t3)" opacity="0.4" stroke-width="14" filter="url(#soft)"/>
    <path d="M 540 510 C 700 430, 900 620, 1180 490" stroke="url(#t4)" opacity="0.4" stroke-width="14" filter="url(#soft)"/>

    <!-- Crisp thread lines -->
    <path d="M 540 180 C 700 80, 900 280, 1180 160" stroke="url(#t1)" stroke-width="3"/>
    <path d="M 540 290 C 700 200, 900 400, 1180 270" stroke="url(#t2)" stroke-width="3"/>
    <path d="M 540 400 C 700 320, 900 520, 1180 380" stroke="url(#t3)" stroke-width="3"/>
    <path d="M 540 510 C 700 430, 900 620, 1180 490" stroke="url(#t4)" stroke-width="3"/>
  </g>

  <!-- Thread end dots with labels (right side) -->
  <g font-family="Georgia, serif" font-size="14" fill="#ffffff" opacity="0.85">
    <circle cx="1140" cy="170" r="5" fill="#7dd3a0"/>
    <text x="1100" y="153" text-anchor="end" letter-spacing="2">NUTRITION</text>

    <circle cx="1140" cy="280" r="5" fill="#fbbf24"/>
    <text x="1100" y="263" text-anchor="end" letter-spacing="2">EXERCISE</text>

    <circle cx="1140" cy="390" r="5" fill="#818cf8"/>
    <text x="1100" y="373" text-anchor="end" letter-spacing="2">SLEEP</text>

    <circle cx="1140" cy="500" r="5" fill="#f472b6"/>
    <text x="1100" y="483" text-anchor="end" letter-spacing="2">EMOTION</text>
  </g>

  <!-- Left side: title block -->
  <g>
    <text x="80" y="135" font-family="Georgia, serif" font-size="22" fill="#cbd5e1" font-style="italic">...from the desk of Pinal Bhatt</text>

    <text x="80" y="225" font-family="Georgia, serif" font-size="68" font-weight="700" fill="#ffffff">My Wellness</text>
    <text x="80" y="295" font-family="Georgia, serif" font-size="68" font-weight="700" fill="#ffffff" font-style="italic">Threads.</text>

    <text x="80" y="360" font-family="Georgia, serif" font-size="22" fill="#cbd5e1">Four threads I keep weaving</text>
    <text x="80" y="390" font-family="Georgia, serif" font-size="22" fill="#cbd5e1">through every ordinary day.</text>

    <!-- Divider -->
    <line x1="80" y1="430" x2="180" y2="430" stroke="#7dd3a0" stroke-width="2"/>

    <text x="80" y="475" font-family="Georgia, serif" font-size="26" fill="#ffffff" font-style="italic">Live Well, Build Long.</text>
  </g>
</svg>
