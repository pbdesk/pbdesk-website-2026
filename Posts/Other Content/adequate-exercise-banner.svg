<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Adequate Exercise — the movement minimum that actually works">
  <defs>
    <linearGradient id="bgE" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3a0d05"/>
      <stop offset="55%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="trail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#fff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bgE)"/>

  <g transform="translate(0, 150)">
  <!-- sun glow -->
  <circle cx="1320" cy="180" r="180" fill="#fde68a" fill-opacity="0.35"/>
  <circle cx="1320" cy="180" r="100" fill="#fef3c7" fill-opacity="0.55"/>

  <!-- footprint trail / step rhythm -->
  <g opacity="0.55">
    <ellipse cx="900"  cy="500" rx="22" ry="14" fill="#fff" transform="rotate(-12 900 500)"/>
    <ellipse cx="1000" cy="470" rx="22" ry="14" fill="#fff" transform="rotate(-12 1000 470)"/>
    <ellipse cx="1100" cy="500" rx="22" ry="14" fill="#fff" transform="rotate(-12 1100 500)"/>
    <ellipse cx="1200" cy="470" rx="22" ry="14" fill="#fff" transform="rotate(-12 1200 470)"/>
    <ellipse cx="1300" cy="500" rx="22" ry="14" fill="#fff" transform="rotate(-12 1300 500)"/>
    <ellipse cx="1400" cy="470" rx="22" ry="14" fill="#fff" transform="rotate(-12 1400 470)"/>
    <ellipse cx="1500" cy="500" rx="22" ry="14" fill="#fff" transform="rotate(-12 1500 500)"/>
  </g>

  <!-- horizon line -->
  <rect x="0" y="540" width="1600" height="3" fill="url(#trail)"/>

  <!-- moving figure (abstract) -->
  <g transform="translate(1130 260)" fill="#fff" opacity="0.92">
    <circle cx="0" cy="0" r="28"/>
    <rect x="-12" y="28" width="24" height="100" rx="10"/>
    <rect x="-50" y="50" width="40" height="14" rx="7" transform="rotate(-25 -30 57)"/>
    <rect x="10"  y="50" width="40" height="14" rx="7" transform="rotate(25 30 57)"/>
    <rect x="-30" y="125" width="20" height="80" rx="8" transform="rotate(-12 -20 165)"/>
    <rect x="10"  y="125" width="20" height="80" rx="8" transform="rotate(12 20 165)"/>
  </g>

  <!-- text -->
  <g font-family="Georgia, 'Times New Roman', serif" fill="#fff8e7">
    <text x="80" y="170" font-size="26" letter-spacing="3" opacity="0.85">My Wellness Threads</text>
    <text x="80" y="310" font-size="96" font-weight="700">Adequate</text>
    <text x="80" y="410" font-size="96" font-weight="700">Exercise</text>
    <text x="80" y="475" font-size="30" font-style="italic" opacity="0.9">Keep Moving, be active throughout the Day!</text>
  </g>

  <rect x="80" y="340" width="120" height="3" fill="#fde68a"/>
  </g>
</svg>
