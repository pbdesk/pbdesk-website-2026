<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Cellular Nutrition — feeding the 37 trillion">
  <defs>
    <linearGradient id="bgN" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f3d2e"/>
      <stop offset="55%" stop-color="#1a6b4c"/>
      <stop offset="100%" stop-color="#d8b864"/>
    </linearGradient>
    <radialGradient id="cellGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff8d6" stop-opacity="0.85"/>
      <stop offset="60%" stop-color="#9bd9a8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#9bd9a8" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bgN)"/>

  <g transform="translate(0, 150)">
  <!-- abstract cells -->
  <g opacity="0.55">
    <circle cx="1200" cy="300" r="240" fill="url(#cellGlow)"/>
    <circle cx="1200" cy="300" r="170" fill="none" stroke="#fff8d6" stroke-opacity="0.35" stroke-width="2"/>
    <circle cx="1200" cy="300" r="110" fill="none" stroke="#fff8d6" stroke-opacity="0.5" stroke-width="2"/>
    <circle cx="1200" cy="300" r="55" fill="#fff8d6" fill-opacity="0.7"/>
  </g>
  <g opacity="0.4">
    <circle cx="1430" cy="140" r="70" fill="url(#cellGlow)"/>
    <circle cx="1450" cy="500" r="100" fill="url(#cellGlow)"/>
    <circle cx="1010" cy="120" r="55" fill="url(#cellGlow)"/>
    <circle cx="980" cy="510" r="80" fill="url(#cellGlow)"/>
  </g>

  <!-- chlorophyll leaf hint -->
  <path d="M 60 540 Q 180 360 360 320 Q 220 460 60 540 Z" fill="#9bd9a8" fill-opacity="0.18"/>

  <!-- text -->
  <g font-family="Georgia, 'Times New Roman', serif" fill="#fff8d6">
    <text x="80" y="170" font-size="26" letter-spacing="3" opacity="0.85">My Wellness Threads</text>
    <text x="80" y="310" font-size="96" font-weight="700">Cellular</text>
    <text x="80" y="410" font-size="96" font-weight="700">Nutrition</text>
    <text x="80" y="475" font-size="30" font-style="italic" opacity="0.9">Feeding the 37 trillion.</text>
  </g>

  <!-- thin underline -->
  <rect x="80" y="340" width="120" height="3" fill="#d8b864"/>
  </g>
</svg>
